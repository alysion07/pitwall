<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>팀 & 머신 — PIT WALL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#ffffff; --bg-soft:#f7f7f9; --card:#ffffff; --text:#14141a; --text-mid:#4a4a57; --text-dim:#86868f; --border:#e6e6ec; --border-soft:#f0f0f4; --accent:#E10600; --accent-soft:rgba(225,6,0,.08); --chip-bg:#f2f2f5; --bar-bg:rgba(255,255,255,.85); --shadow:0 1px 2px rgba(20,20,26,.04),0 10px 30px -14px rgba(20,20,26,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e11; --bg-soft:#141419; --card:#16161b; --text:#f0f0f3; --text-mid:#b6b6c0; --text-dim:#82828e; --border:#26262e; --border-soft:#1e1e25; --accent:#FF3B30; --accent-soft:rgba(255,59,48,.12); --chip-bg:#1e1e25; --bar-bg:rgba(14,14,17,.85); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif; font-size:15.5px; line-height:1.7; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; }
  @media (prefers-color-scheme: dark) { body { background:radial-gradient(1200px 600px at 20% -10%, rgba(255,59,48,.07), transparent 60%), var(--bg); } }
  a { color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 32px; }
  .top { position:sticky; top:0; z-index:30; background:var(--bar-bg); backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px); border-bottom:1px solid var(--border-soft); }
  .top-inner { display:flex; align-items:center; gap:14px; padding:14px 0; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:900; font-size:19px; letter-spacing:.02em; font-style:italic; text-decoration:none; }
  .brand .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .brand .accent { color:var(--accent); }
  .top .crumb { color:var(--text-dim); font-size:12.5px; margin-left:8px; padding-left:14px; border-left:1px solid var(--border); }
  .top .sp { flex:1; }
  .btn { border:1px solid var(--border); background:var(--chip-bg); color:var(--text-mid); font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:.15s; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { color:var(--text); border-color:var(--text); }
  .btn svg { width:14px; height:14px; }
  .btn.dis { opacity:.35; pointer-events:none; }
  footer { margin-top:56px; padding:24px 0 56px; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-dim); text-align:center; }
  footer .b { color:var(--accent); font-weight:700; }
  .hero { padding:52px 0 28px; }
  .hero .kicker { font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px; }
  .hero h1 { margin:0 0 12px; font-size:clamp(30px,5vw,42px); font-weight:800; letter-spacing:-0.035em; line-height:1.1; }
  .hero p { margin:0; color:var(--text-mid); font-size:15px; max-width:720px; line-height:1.7; }
  .pu-legend { display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 0; }
  .pu-legend span { font-size:12px; font-weight:600; color:var(--text-mid); background:var(--chip-bg); border:1px solid var(--border); padding:5px 11px; border-radius:999px; }
  .pu-legend b { color:var(--text); }
  .teams { display:grid; grid-template-columns:repeat(auto-fill, minmax(500px,1fr)); gap:18px; padding:28px 0 0; }
  .team { background:var(--card); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; border-top:4px solid var(--tc); scroll-margin-top:90px; }
  .team .car { background:var(--bg-soft); border-bottom:1px solid var(--border-soft); }
  .team .car img { display:block; width:100%; aspect-ratio:1200/430; object-fit:cover; }
  .team .body { padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px; }
  .team .name { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .team .name h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-0.03em; }
  .team .name .en { font-size:12.5px; color:var(--text-dim); }
  .team .chassis { margin-left:auto; font-size:13px; font-weight:800; color:var(--tc); background:color-mix(in srgb, var(--tc) 14%, transparent); border:1px solid color-mix(in srgb, var(--tc) 40%, transparent); padding:3px 10px; border-radius:999px; letter-spacing:.02em; }
  .team .intro { margin:0; font-size:14px; color:var(--text-mid); line-height:1.7; }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin:0; }
  .facts div { display:flex; flex-direction:column; gap:2px; padding:8px 0; border-top:1px solid var(--border-soft); }
  .facts dt { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }
  .facts dd { margin:0; font-size:13.5px; font-weight:600; line-height:1.45; }
  .drv { display:flex; gap:8px; flex-wrap:wrap; }
  .drv span { font-size:13px; font-weight:600; background:var(--chip-bg); border:1px solid var(--border); padding:6px 12px; border-radius:10px; }
  .drv span::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--tc); margin-right:8px; }
  .note { margin:26px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.6; }
  @media (max-width:760px) { .wrap { padding:0 18px; } .teams { grid-template-columns:1fr; } .facts { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="top"><div class="wrap top-inner">
  <a class="brand" href="index.html" style="text-decoration:none"><span class="dot"></span>PIT<span class="accent">WALL</span></a>
  <div class="crumb">팀 & 머신 · 2026</div>
  <div class="sp"></div>
  <a class="btn" id="circLink" href="circuit.html">서킷 가이드</a>
  <a class="btn" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>대시보드</a>
</div></div>

<div class="wrap" id="main"></div>

<script src="data.js"></script>
<script src="teams.js"></script>
<script>
(function () {
  var D = window.F1DATA, T = window.F1TEAMS, root = document.getElementById('main');
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  var today = new Date(); today.setHours(0,0,0,0);
  var next = D.calendar.filter(function (r) { return parse(r.end) >= today; })[0];
  if (next) document.getElementById('circLink').href = 'circuit.html?round=' + next.round;

  // 파워유닛별 공급 현황 (팀 데이터에서 자동 집계)
  var byPu = {};
  Object.keys(T).forEach(function (k) { var pu = T[k].pu; (byPu[pu] = byPu[pu] || []).push(D.teams[k] ? D.teams[k].ko : k); });

  var h = '<div class="hero"><div class="kicker">' + D.meta.season + ' Season · 11 Teams</div><h1>팀 & <span style="color:var(--accent)">머신</span></h1>';
  h += '<p>2026년은 파워유닛(엔진+전기 시스템)과 공력 규정이 함께 바뀐 첫해입니다. 각 팀의 섀시 이름, 어떤 엔진을 쓰는지, 누가 이끄는지와 정규 드라이버를 정리했습니다. 이번 시즌 순위·결과는 담지 않습니다.</p>';
  h += '<div class="pu-legend">' + Object.keys(byPu).map(function (pu) { return '<span><b>' + esc(pu) + '</b> → ' + esc(byPu[pu].join(' · ')) + '</span>'; }).join('') + '</div></div>';

  // 표시 순서: data.js teams 순서(고정, 순위와 무관)
  h += '<div class="teams">';
  Object.keys(D.teams).forEach(function (k) {
    var t = T[k], m = D.teams[k]; if (!t) return;
    h += '<article class="team" id="' + t.slug + '" style="--tc:' + m.color + '">';
    if (t.car) h += '<div class="car"><img src="' + t.car + '" alt="' + esc(m.ko) + ' ' + esc(t.chassis) + '" loading="lazy"></div>';
    h += '<div class="body">';
    h += '<div class="name"><h2>' + esc(m.ko) + '</h2><span class="en">' + esc(t.full) + '</span><span class="chassis">' + esc(t.chassis) + '</span></div>';
    h += '<p class="intro">' + esc(t.intro) + '</p>';
    h += '<div class="drv">' + t.drivers.map(function (d) { return '<span>' + esc(d) + '</span>'; }).join('') + '</div>';
    h += '<dl class="facts">';
    h += '<div><dt>파워유닛</dt><dd>' + esc(t.pu) + '</dd></div>';
    h += '<div><dt>베이스</dt><dd>' + esc(t.base) + '</dd></div>';
    h += '<div><dt>팀 대표</dt><dd>' + esc(t.chief) + '</dd></div>';
    h += '<div><dt>기술 책임</dt><dd>' + esc(t.tech) + '</dd></div>';
    h += '<div><dt>첫 참가</dt><dd>' + t.first + (t.first === D.meta.season ? ' <small style="color:var(--accent);font-weight:800">NEW</small>' : '') + '</dd></div>';
    h += '<div><dt>컨스트럭터 타이틀</dt><dd>' + (t.titles ? t.titles + '회' : '없음') + '</dd></div>';
    h += '</dl></div></article>';
  });
  h += '</div>';
  h += '<p class="note">머신 사진과 팀 정보는 Formula1.com 공식 팀 페이지 기준(2026-09-03). 컨스트럭터 타이틀은 2025 시즌 종료 기준이며, 이번 시즌 순위·포인트·우승 기록은 스포일러 방지를 위해 싣지 않습니다.</p>';
  h += '<footer><span class="b">PIT WALL</span> · 팀 & 머신 · 2026</footer>';
  root.innerHTML = h;
})();
</script>
</body>
</html>
