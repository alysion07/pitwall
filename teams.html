<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>팀 & 머신 — PIT WALL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#ffffff; --bg-soft:#f7f7f9; --card:#ffffff; --text:#14141a; --text-mid:#4a4a57; --text-dim:#86868f; --border:#e6e6ec; --border-soft:#f0f0f4; --accent:#E10600; --accent-soft:rgba(225,6,0,.08); --chip-bg:#f2f2f5; --bar-bg:rgba(255,255,255,.85); --shadow:0 1px 2px rgba(20,20,26,.04),0 10px 30px -14px rgba(20,20,26,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e11; --bg-soft:#141419; --card:#16161b; --text:#f0f0f3; --text-mid:#b6b6c0; --text-dim:#82828e; --border:#26262e; --border-soft:#1e1e25; --accent:#FF3B30; --accent-soft:rgba(255,59,48,.12); --chip-bg:#1e1e25; --bar-bg:rgba(14,14,17,.85); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif; font-size:15.5px; line-height:1.7; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; }
  @media (prefers-color-scheme: dark) { body { background:radial-gradient(1200px 600px at 20% -10%, rgba(255,59,48,.07), transparent 60%), var(--bg); } }
  a { color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 32px; }
  .top { position:sticky; top:0; z-index:30; background:var(--bar-bg); backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px); border-bottom:1px solid var(--border-soft); }
  .top-inner { display:flex; align-items:center; gap:14px; padding:14px 0; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:900; font-size:19px; letter-spacing:.02em; font-style:italic; text-decoration:none; }
  .brand .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .brand .accent { color:var(--accent); }
  .top .crumb { color:var(--text-dim); font-size:12.5px; margin-left:8px; padding-left:14px; border-left:1px solid var(--border); }
  .top .sp { flex:1; }
  .btn { border:1px solid var(--border); background:var(--chip-bg); color:var(--text-mid); font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:.15s; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { color:var(--text); border-color:var(--text); }
  .btn svg { width:14px; height:14px; }
  .btn.dis { opacity:.35; pointer-events:none; }
  footer { margin-top:56px; padding:24px 0 56px; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-dim); text-align:center; }
  footer .b { color:var(--accent); font-weight:700; }
  /* 팀 선택 스트립 (상단 고정 바 두 번째 줄) */
  .tstrip { display:flex; gap:6px; overflow-x:auto; padding:0 24px 10px; scrollbar-width:none; }
  .tstrip::-webkit-scrollbar { display:none; }
  .tchip { flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:650; color:var(--text-mid); text-decoration:none; padding:6px 12px 6px 9px; border-radius:999px; border:1px solid var(--border); background:var(--chip-bg); transition:.15s; white-space:nowrap; }
  .tchip i { width:9px; height:9px; border-radius:50%; background:var(--tc); box-shadow:0 0 0 2px color-mix(in srgb, var(--tc) 30%, transparent); }
  .tchip:hover { color:var(--text); border-color:var(--tc); }
  .tchip.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  /* 목록(파라미터 없을 때) */
  .hero { padding:52px 0 8px; }
  .hero .kicker { font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px; }
  .hero h1 { margin:0 0 12px; font-size:clamp(30px,5vw,42px); font-weight:800; letter-spacing:-0.035em; line-height:1.1; }
  .hero p { margin:0; color:var(--text-mid); font-size:15px; max-width:720px; line-height:1.7; }
  .pu-legend { display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 0; }
  .pu-legend span { font-size:12px; font-weight:600; color:var(--text-mid); background:var(--chip-bg); border:1px solid var(--border); padding:5px 11px; border-radius:999px; }
  .pu-legend b { color:var(--text); }
  .tgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; padding:28px 0 0; }
  .tile { display:block; text-decoration:none; background:var(--card); border:1px solid var(--border); border-top:4px solid var(--tc); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); transition:.15s; }
  .tile:hover { transform:translateY(-2px); border-color:var(--tc); }
  .tile img { display:block; width:100%; aspect-ratio:1200/430; object-fit:cover; background:var(--bg-soft); }
  .tile .tb { padding:12px 14px 14px; }
  .tile .tn { font-size:16px; font-weight:800; letter-spacing:-0.02em; }
  .tile .ts { font-size:12px; color:var(--text-dim); margin-top:3px; }
  .tile .ts b { color:var(--tc); font-weight:800; }
  /* 팀 상세 */
  .thero { padding:40px 0 28px; display:grid; grid-template-columns:minmax(0,1fr) 440px; gap:36px; align-items:center; }
  .thero .kicker { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px; }
  .thero .kicker i { width:10px; height:10px; border-radius:50%; background:var(--tc); }
  .thero h1 { margin:0 0 4px; font-size:clamp(32px,5vw,46px); font-weight:800; letter-spacing:-0.035em; line-height:1.08; }
  .thero .full { font-size:14px; color:var(--text-dim); margin:0 0 18px; }
  .thero .intro { margin:0; color:var(--text-mid); font-size:15px; line-height:1.75; }
  .carbox { background:var(--card); border:1px solid var(--border); border-top:4px solid var(--tc); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .carbox img { display:block; width:100%; aspect-ratio:1200/430; object-fit:cover; background:var(--bg-soft); }
  .carbox .cap { display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--border-soft); font-size:12.5px; color:var(--text-dim); }
  .carbox .cap b { font-size:16px; font-weight:800; color:var(--tc); letter-spacing:.02em; }
  .carbox .cap span:last-child { margin-left:auto; }
  section { padding-top:36px; }
  .sec-h { display:flex; align-items:baseline; gap:12px; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid var(--text); }
  .sec-h h2 { margin:0; font-size:20px; font-weight:800; letter-spacing:-0.03em; }
  .sec-h .n { font-size:12px; color:var(--text-dim); margin-left:auto; }
  .facts { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; margin:0; }
  .facts div { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .facts dt { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px; }
  .facts dd { margin:0; font-size:15px; font-weight:700; line-height:1.45; letter-spacing:-0.01em; }
  .facts dd small { color:var(--accent); font-weight:800; margin-left:6px; }
  .drv { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .drv div { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); font-size:15px; font-weight:700; }
  .drv div::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--tc); flex:0 0 auto; }
  .drv .role { margin-left:auto; font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase; }
  .pager { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:44px; }
  .pager a { display:block; text-decoration:none; padding:16px 18px; border:1px solid var(--border); border-radius:14px; background:var(--card); transition:.15s; }
  .pager a:hover { border-color:var(--text); }
  .pager a.next { text-align:right; }
  .pager .lab { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px; }
  .pager .nm { font-size:15px; font-weight:750; }
  .note { margin:26px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.6; }
  .empty { padding:60px 0; text-align:center; color:var(--text-dim); }
  @media (max-width:900px) { .thero { grid-template-columns:1fr; gap:22px; } }
  @media (max-width:760px) { .wrap { padding:0 18px; } .drv { grid-template-columns:1fr; } .pager { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="top">
<div class="wrap top-inner">
  <a class="brand" href="index.html" style="text-decoration:none"><span class="dot"></span>PIT<span class="accent">WALL</span></a>
  <div class="crumb" id="crumb">팀 & 머신 · 2026</div>
  <div class="sp"></div>
  <a class="btn" id="circLink" href="circuit.html">서킷 가이드</a>
  <a class="btn" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>대시보드</a>
</div>
<!-- 팀 선택 스트립: teams.js의 팀 목록에서 자동 생성 -->
<nav class="wrap tstrip" id="tstrip" aria-label="팀 선택"></nav>
</div>

<div class="wrap" id="main"></div>

<script src="data.js"></script>
<script src="teams.js"></script>
<script>
(function () {
  var D = window.F1DATA, T = window.F1TEAMS, root = document.getElementById('main');
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  var today = new Date(); today.setHours(0,0,0,0);
  var next = D.calendar.filter(function (r) { return parse(r.end) >= today; })[0];
  if (next) document.getElementById('circLink').href = 'circuit.html?round=' + next.round;

  // 표시 순서 = data.js teams 순서(고정, 순위와 무관)
  var keys = Object.keys(D.teams).filter(function (k) { return T[k]; });
  var slug = new URLSearchParams(location.search).get('team');
  var curKey = keys.filter(function (k) { return T[k].slug === slug; })[0] || null;

  // ---------- 팀 스트립 ----------
  document.getElementById('tstrip').innerHTML = '<a class="tchip' + (curKey ? '' : ' on') + '" href="teams.html" style="--tc:var(--accent)"><i></i>전체</a>' + keys.map(function (k) {
    return '<a class="tchip' + (k === curKey ? ' on' : '') + '" href="teams.html?team=' + T[k].slug + '" style="--tc:' + D.teams[k].color + '"><i></i>' + esc(D.teams[k].ko) + '</a>';
  }).join('');

  var h = '';
  if (!curKey) {
    // ---------- 목록 ----------
    var byPu = {};
    keys.forEach(function (k) { var pu = T[k].pu; (byPu[pu] = byPu[pu] || []).push(D.teams[k].ko); });
    h += '<div class="hero"><div class="kicker">' + D.meta.season + ' Season · ' + keys.length + ' Teams</div><h1>팀 & <span style="color:var(--accent)">머신</span></h1>';
    h += '<p>2026년은 파워유닛(엔진+전기 시스템)과 공력 규정이 함께 바뀐 첫해입니다. 팀을 고르면 섀시·파워유닛·수뇌부·정규 라인업과 2026년 상황을 볼 수 있습니다. 이번 시즌 순위·결과는 담지 않습니다.</p>';
    h += '<div class="pu-legend">' + Object.keys(byPu).map(function (pu) { return '<span><b>' + esc(pu) + '</b> → ' + esc(byPu[pu].join(' · ')) + '</span>'; }).join('') + '</div></div>';
    h += '<div class="tgrid">' + keys.map(function (k) {
      var t = T[k], m = D.teams[k];
      return '<a class="tile" href="teams.html?team=' + t.slug + '" style="--tc:' + m.color + '">' + (t.car ? '<img src="' + t.car + '" alt="" loading="lazy">' : '') + '<div class="tb"><div class="tn">' + esc(m.ko) + '</div><div class="ts"><b>' + esc(t.chassis) + '</b> · ' + esc(t.pu.replace(/\s*\(.*\)$/, '')) + '</div></div></a>';
    }).join('') + '</div>';
    h += '<p class="note">머신 사진과 팀 정보는 Formula1.com 공식 팀 페이지 기준(2026-09-03). 이번 시즌 순위·포인트·우승 기록은 스포일러 방지를 위해 싣지 않습니다.</p>';
    document.title = '팀 & 머신 — PIT WALL';
  } else {
    // ---------- 팀 상세 ----------
    var t = T[curKey], m = D.teams[curKey], idx = keys.indexOf(curKey);
    document.title = m.ko + ' ' + t.chassis + ' — 팀 & 머신 · PIT WALL';
    document.getElementById('crumb').textContent = '팀 & 머신 · ' + m.ko;
    h += '<div class="thero" style="--tc:' + m.color + '"><div>';
    h += '<div class="kicker"><i></i>' + D.meta.season + ' · Team ' + (idx+1) + ' / ' + keys.length + (t.first === D.meta.season ? ' <span style="color:var(--accent)">신생 팀</span>' : '') + '</div>';
    h += '<h1>' + esc(m.ko) + '</h1><p class="full">' + esc(t.full) + '</p>';
    h += '<p class="intro">' + esc(t.intro) + '</p></div>';
    h += '<div class="carbox">' + (t.car ? '<img src="' + t.car + '" alt="' + esc(m.ko) + ' ' + esc(t.chassis) + '">' : '') + '<div class="cap"><b>' + esc(t.chassis) + '</b><span>' + D.meta.season + ' 시즌 머신</span><span>PU · ' + esc(t.pu.replace(/\s*\(.*\)$/, '')) + '</span></div></div>';
    h += '</div>';

    h += '<section style="--tc:' + m.color + '"><div class="sec-h"><h2>정규 드라이버</h2><span class="n">시즌 개막 라인업 · 대체 출전은 브리핑 참조</span></div><div class="drv">';
    t.drivers.forEach(function (d, i) { h += '<div>' + esc(d) + '<span class="role">Car ' + (i+1) + '</span></div>'; });
    h += '</div></section>';

    h += '<section><div class="sec-h"><h2>팀 정보</h2><span class="n">Formula1.com 기준</span></div><dl class="facts">';
    h += '<div><dt>섀시</dt><dd>' + esc(t.chassis) + '</dd></div>';
    h += '<div><dt>파워유닛</dt><dd>' + esc(t.pu) + '</dd></div>';
    h += '<div><dt>베이스</dt><dd>' + esc(t.base) + '</dd></div>';
    h += '<div><dt>팀 대표</dt><dd>' + esc(t.chief) + '</dd></div>';
    h += '<div><dt>기술 책임</dt><dd>' + esc(t.tech) + '</dd></div>';
    h += '<div><dt>첫 참가</dt><dd>' + t.first + (t.first === D.meta.season ? '<small>NEW</small>' : '') + '</dd></div>';
    h += '<div><dt>컨스트럭터 타이틀</dt><dd>' + (t.titles ? t.titles + '회' : '없음') + '</dd></div>';
    h += '</dl><p class="note">컨스트럭터 타이틀은 2025 시즌 종료 기준. 이번 시즌 순위·포인트·우승 기록은 스포일러 방지를 위해 싣지 않습니다.</p></section>';

    var pk = keys[idx-1], nk = keys[idx+1];
    h += '<div class="pager">';
    h += pk ? '<a href="teams.html?team=' + T[pk].slug + '"><div class="lab">← 이전 팀</div><div class="nm">' + esc(D.teams[pk].ko) + ' · ' + esc(T[pk].chassis) + '</div></a>' : '<a href="teams.html"><div class="lab">← 전체 목록</div><div class="nm">팀 & 머신</div></a>';
    h += nk ? '<a class="next" href="teams.html?team=' + T[nk].slug + '"><div class="lab">다음 팀 →</div><div class="nm">' + esc(D.teams[nk].ko) + ' · ' + esc(T[nk].chassis) + '</div></a>' : '<a class="next" href="teams.html"><div class="lab">전체 목록 →</div><div class="nm">팀 & 머신</div></a>';
    h += '</div>';
  }
  h += '<footer><span class="b">PIT WALL</span> · 팀 & 머신 · ' + D.meta.season + '</footer>';
  root.innerHTML = h;
})();
</script>
</body>
</html>
